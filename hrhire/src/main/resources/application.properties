# Port de l'application
server.port=${SERVER_PORT:8089}

# Security
#spring.security.enabled=false

# API endpoints for language models
llm.api.mistral.url=https://api.mistral.ai/v1/chat/completions
llm.api.groq.url=https://api.groq.com/openai/v1/chat/completions
llm.api.huggingface.url=https://api-inference.huggingface.co/models/gpt2
llm.api.openai.url=https://api.openai.com/v1/chat/completions
llm.api.default=openai

# URL du serveur Keycloak
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:hirecraft}
keycloak.resource=${KEYCLOAK_RESOURCE:hirecraft-client}
keycloak.credentials.secret=${KEYCLOAK_CREDENTIALS_SECRET}

# Keycloak security constraints
keycloak.security-constraints[0].authRoles[0]=user
keycloak.security-constraints[0].securityCollections[0].patterns[0]=/*
spring.main.allow-bean-definition-overriding=true
keycloak.public-client=true
keycloak.principal-attribute=preferred_username
keycloak.ssl-required=external

# Spring Security OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/hirecraft}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/hirecraft/protocol/openid-connect/certs}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/hirecraft}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.jpa.hibernate.ddl-auto=update

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=always

# Multi-tenancy Configuration
spring.jpa.properties.hibernate.multiTenancy=SCHEMA
spring.jpa.properties.hibernate.tenant_identifier_resolver=ma.nexotek.HireCraft.config.TenantIdentifierResolver
spring.jpa.properties.hibernate.multi_tenant_connection_provider=ma.nexotek.HireCraft.config.DataSourceBasedMultiTenantConnectionProviderImpl

logging.level.web=DEBUG
logging.level.org.springframework.web=DEBUG

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.debug=true
app.frontend.url=${FRONTEND_URL:https://hire.nexotek.ma}

# Google Calendar OAuth2 Configuration
google.oauth.callback.uri=${GOOGLE_OAUTH_CALLBACK_URI:http://localhost:8089/oauth2/oauth2callback}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google Calendar Configuration
app.google.calendar.id=primary
app.google.calendar.credentials-path=classpath:client_secret.json

# Google OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_OAUTH_CALLBACK_URI:http://localhost:8089/oauth2/oauth2callback}

# App Configuration
app.encryption.secret-key=${APP_ENCRYPTION_SECRET_KEY}
app.base-url=${APP_BASE_URL:https://hirenexotek.com}

# Twilio configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.from-phone=${TWILIO_FROM_PHONE}

# Zoom API Credentials
zoom.account.id=${ZOOM_ACCOUNT_ID}
zoom.client.id=${ZOOM_CLIENT_ID}
zoom.client.secret=${ZOOM_CLIENT_SECRET}

# PostgreSQL Large Objects
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.datasource.hikari.auto-commit=false
spring.jpa.open-in-view=true

# CV Scoring AI Configuration
cv.scoring.model.path=models/resume-job-matcher-all-MiniLM-L6-v2.onnx
cv.scoring.tokenizer.path=models/resume-job-matcher-all-MiniLM-L6-v2-tokenizer.json
cv.scoring.max.length=512

# CV Scoring Weights
cv.scoring.weights.semantic=0.35
cv.scoring.weights.skills=0.40
cv.scoring.weights.experience=0.15
cv.scoring.weights.education=0.10

# CV Scoring Thresholds
cv.scoring.thresholds.excellent=80
cv.scoring.thresholds.good=65
cv.scoring.thresholds.review=45
cv.scoring.ai.timeout.seconds=10
cv.scoring.fallback.confidence.threshold=0.7

# Email Configuration
email.reminder.subject=RAPPEL : Entretien dans moins d'une heure

# LinkedIn API Configuration
linkedin.access-token=${LINKEDIN_ACCESS_TOKEN}
linkedin.author-urn=${LINKEDIN_AUTHOR_URN}
linkedin.api-url=https://api.linkedin.com/v2/ugcPosts

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB