<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Entretien RH - Candidat</title>
</head>
<body>
    <p>Bonjour,</p>
    <p>Vous êtes invité(e) à un entretien pour le poste de <b th:text="${position}"></b>.</p>
    <p><b>📅 Détails de l'entretien :</b><br>
        - Date et heure : <b th:text="${dateTime}"></b><br>
        - Position : <b th:text="${position}"></b><br>
<!--        - Intervieweur : <b th:text="${interviewerName}"></b>-->
    </p>
    <p>🔗 <b>Lien Google Meet pour rejoindre l'entretien :</b><br>
        <a th:href="${meetLink}" th:text="${meetLink}"></a>
    </p>
    <p>⏰ Veuillez vous connecter 5 minutes avant l'heure prévue.</p>
    <p>Cordialement,</p>
</body>
</html>
