<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Notification Statut Entretien</title>
</head>
<body>

    <p>📢 <b>NOTIFICATION :</b> <span th:text="${statusTitle}"></span></p>

    <p>Cordialement,</p>
</body>
</html>
